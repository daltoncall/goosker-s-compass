name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build with Gradle
        run: gradle build
      - name: Check boss-bar mixin metadata
        run: python3 scripts/check_mixin_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: gooskers-compass
          path: build/libs/*.jar
